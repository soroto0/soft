<!doctype html>
<html lang="en" data-composition-variables='[
    {"id":"content","type":"string","label":"Banner text","default":"Sample banner text"},
    {"id":"dur","type":"number","label":"Duration (seconds)","default":4}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: 'Segoe UI Black'; src: local('Segoe UI Black'); }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #banner-wrap {
        position: absolute; left: 0; right: 0; bottom: 90px;
        display: flex; justify-content: flex-start; align-items: center;
        padding: 0 90px;
      }
      #banner-bar {
        position: relative;
        width: 100%; max-width: 1400px;
        background: rgba(15,15,18,0.88);
        padding: 26px 48px 26px 40px;
        transform-origin: left center;
        display: flex; align-items: center; gap: 24px;
        box-shadow: 0 14px 34px rgba(0,0,0,0.5);
      }
      #banner-stripe {
        position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
        background: #5e7c8d;
        transform-origin: top;
      }
      #banner-text {
        color: #ffffff; font-family: 'Segoe UI Black', 'Arial', sans-serif;
        font-size: 38px; text-transform: uppercase; letter-spacing: 0.5px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <!--
      Третий вариант banner (см. remotion/src/Overlay.tsx: Banner,
      BannerRibbon) — нижний бар с wipe-раскрытием слева, а не плашка
      сверху. Форма/позиция/анимация намеренно другие — визуальная
      вариативность монтажа между проектами, не перекраска одного шаблона.
    -->
    <div id="root" data-composition-id="banner" data-start="0" data-width="1920" data-height="1080">
      <div id="banner-wrap" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="banner-bar">
          <div id="banner-stripe"></div>
          <div id="banner-text" data-var-text="content">Sample banner text</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const vars = window.__hyperframes.getVariables();
      const dur = Number(vars.dur) || 4;
      document.getElementById('banner-wrap').setAttribute('data-duration', String(dur));

      const tl = gsap.timeline({ paused: true });
      // wipe: бар растёт по ширине слева направо (scaleX — allowlisted
      // transform, не clip-path), полоска-акцент — сверху вниз (scaleY),
      // текст проявляется следом, когда бар уже почти раскрыт.
      tl.fromTo('#banner-bar', { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: 'power3.out' }, 0);
      tl.fromTo('#banner-stripe', { scaleY: 0 },
        { scaleY: 1, duration: 0.3, ease: 'power2.out' }, 0.1);
      tl.fromTo('#banner-text', { opacity: 0 },
        { opacity: 1, duration: 0.25 }, 0.35);
      tl.to('#banner-bar', { opacity: 0, duration: 0.3 }, Math.max(dur - 0.3, 0));
      window.__timelines['banner'] = tl;
    </script>
  </body>
</html>
